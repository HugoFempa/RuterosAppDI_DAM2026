<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loggeate</title>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">

</head>
<body>
    <header class="container-fluid">
        <div class="row">
            <div class="col" style="border: 2px solid red;">ESTO ES LA CABECERA</div>
        </div>
    </header>
    <div class="container-fluid">
        <h1 class="text-primary text-center">Loggeate en tu perfil</h1>
        <div class="row justify-content-center mt-4">
            <div class="col-12 col-md-4">
                <div class="card">
                    <div class="card-body">
                        <form action="">
                            <div class="mb-3">
                                <label for="usuario" class="form-label">Usuario</label>
                                <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Usuario o email" required>
                            </div>
                            <div class="mb-3">
                                <label for="contraseña" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="contraseña" name="contraseña" required>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="recordar" name="recordar">
                                <label class="form-check-label" for="recordar">Recordar usuario</label>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Identificarse</button>
                                <a href="Registro.html" class="btn btn-outlined-secondary">Registrarse</a>
                            </div>

                            <div class="text-center mt-3">
                                <a href="Recuperacion.html" class="link-secondary small">¿Has olvidado tu contraseña?</a>   
                            </div>
                        </form>

                        <hr class="my-4">
                        <p class="text-center text-secondary small">o continúa con</p>

                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-outlined-danger">Continuar con Google</button>
                            <button type="button" class="btn btn-outlined-primary">Continuar con Facebook</button>
                            <button type="button" class="btn btn-outlined-dark">Continuar con Apple</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div class="row">
            <div class="col" style="border: 2px solid red;">ESTO ES EL FOOTER</div>
        </div>
    </footer>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
