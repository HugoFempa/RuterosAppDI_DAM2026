<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/templates/ruteros-template.xhtml">

    <ui:define name="title">RUTEROS · Inicio</ui:define>

    <ui:define name="content">

        <!-- Presentación y acceso al listado de rutas -->
        <section class="container my-4 text-center">
            <p class="lead">
                Descubre rutas, guárdalas en favoritos y comparte tus propias aventuras.
            </p>
            <a href="seccionrutas.xhtml" class="btn btn-success btn-lg">
                Explorar rutas
            </a>
        </section>

        <!-- Rutas destacadas: se muestran las 4 primeras del primer slide -->
        <div class="container my-5" id="destacados">
            <h2 class="mb-4">Rutas destacadas</h2>

            <div class="row g-3">
                <ui:repeat value="#{rutasBean.slides[0]}" var="ruta">
                    <div class="col-12 col-sm-6 col-lg-3">
                        <div class="card h-100">
                            <h:graphicImage value="#{ruta.imagen}"
                                            styleClass="card-img-top"
                                            alt="#{ruta.alt}"/>
                            <div class="card-body">
                                <h5 class="card-title">#{ruta.nombre}</h5>
                                <p class="card-text">#{ruta.descripcion}</p>
                            </div>
                        </div>
                    </div>
                </ui:repeat>
            </div>
        </div>

        <!-- Consejos -->
        <div class="container my-5">
            <h2 class="text-center mb-4">
                Consejos para tu próxima aventura
            </h2>

            <div class="row g-4">
                <ui:repeat value="#{rutasBean.consejos}" var="consejo">
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-body">
                                <h4 class="card-title">#{consejo.titulo}</h4>
                                <ul>
                                    <ui:repeat value="#{consejo.items}" var="item">
                                        <li>#{item}</li>
                                    </ui:repeat>
                                </ul>
                            </div>
                        </div>
                    </div>
                </ui:repeat>
            </div>
        </div>

    </ui:define>

</ui:composition>
