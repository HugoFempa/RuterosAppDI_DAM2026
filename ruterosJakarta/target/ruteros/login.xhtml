<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces"
    template="/WEB-INF/templates/template.xhtml">

    <ui:define name="title">
        Login
    </ui:define>
    

    <ui:define name="content">

        <div class="container">
            <div class="row">
                <div class="col-md-6 offset-md-3">
                    <h2>Login</h2>
                    <h:form id="login">                        
                        <p:panel header="Iniciar sesión">
                            <p:outputLabel for="username" value="Usuario:" />
                            <p:inputText id="username" value="#{loginBean.username}" />
                            <p:outputLabel for="password" value="Contraseña:" />
                            <p:password id="password" value="#{loginBean.password}" />
                            <p:commandButton value="Login" action="#{loginBean.login}" update="@form :mensajes" />
                        </p:panel>
                    </h:form>
                </div>
            </div>
        </div>
        
    </ui:define>

</ui:composition>
