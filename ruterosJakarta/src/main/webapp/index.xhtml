<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    template="/WEB-INF/templates/ruteros-template.xhtml">

    <ui:define name="title">Prueba</ui:define>

    <ui:define name="content">

        <div class="container my-5" id="destacados">
            <div class="row">
                <div class="col">
                    <h2 class="mb-4">Rutas destacadas</h2>

                    <!-- INICIO DEL CARRUSEL -->
                    <div id="carruselDestacados" class="carousel slide">

                        <div class="carousel-inner">

                            <ui:repeat value="#{rutasBean.slides}" var="slide" varStatus="slideStatus">
                                <h:panelGroup layout="block"
                                              styleClass="carousel-item #{slideStatus.first ? 'active' : ''}">
                                    <div class="row g-3">

                                        <ui:repeat value="#{slide}" var="ruta">
                                            <div class="col-6 col-lg-3">
                                                <div class="card h-100">
                                                    <h:graphicImage value="#{ruta.imagen}"
                                                                    styleClass="card-img-top"
                                                                    alt="#{ruta.alt}"/>
                                                    <div class="card-body">
                                                        <h5 class="card-title">
                                                            <h:outputText value="#{ruta.nombre}"/>
                                                        </h5>
                                                        <p class="card-text">
                                                            <h:outputText value="#{ruta.descripcion}"/>
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        </ui:repeat>

                                    </div>
                                </h:panelGroup>
                            </ui:repeat>

                        </div>

                        <!-- CONTROLES DENTRO DEL CARRUSEL -->
                        <button class="carousel-control-prev" type="button" data-bs-target="#carruselDestacados" data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Anterior</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#carruselDestacados" data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Siguiente</span>
                        </button>

                    </div>
                    <!-- FIN DEL CARRUSEL -->

                </div>
            </div>
        </div>

        <div class="container my-5">

            <h2 class="text-center mb-4">
                Consejos para tu próxima aventura
            </h2>

            <div class="row g-4">
                <ui:repeat value="#{rutasBean.consejos}" var="consejo">
                    <div class="col-md-6">
                        <div class="card h-100">
                            <div class="card-body">

                                <h4 class="card-title">
                                    <h:outputText value="#{consejo.titulo}"/>
                                </h4>

                                <ul>
                                    <ui:repeat value="#{consejo.items}" var="item">
                                        <li><h:outputText value="#{item}"/></li>
                                    </ui:repeat>
                                </ul>

                            </div>
                        </div>
                    </div>
                </ui:repeat>
            </div>
        </div>

    </ui:define>

</ui:composition>
