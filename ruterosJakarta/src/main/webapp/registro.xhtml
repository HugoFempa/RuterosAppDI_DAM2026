<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core"
    xmlns:pt="jakarta.faces.passthrough"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:p="primefaces"
    template="/WEB-INF/templates/ruteros-template.xhtml">

    <ui:define name="title">RUTEROS · Registro</ui:define>

    <ui:define name="content">

        <div class="container my-4">

            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">

                    <div class="card">
                        <div class="card-body p-4">

                            <h1 class="h3 text-success fw-bold mb-2">
                                Regístrate en RUTEROS
                            </h1>
                            <p class="text-muted mb-4">
                                Crea tu cuenta y empieza tu próxima aventura.
                            </p>

                            <h:form id="registroForm">

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <p:outputLabel for="nombre"
                                                       value="Nombre"
                                                       styleClass="form-label"/>

                                        <p:inputText id="nombre"
                                                     value="#{registroBean.nombre}"
                                                     required="true"
                                                     requiredMessage="El nombre es obligatorio"
                                                     styleClass="form-control"/>

                                        <p:message for="nombre"
                                                   styleClass="text-danger small"/>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <p:outputLabel for="apellidos"
                                                       value="Apellidos"
                                                       styleClass="form-label"/>

                                        <p:inputText id="apellidos"
                                                     value="#{registroBean.apellidos}"
                                                     required="true"
                                                     requiredMessage="Los apellidos son obligatorios"
                                                     styleClass="form-control"/>

                                        <p:message for="apellidos"
                                                   styleClass="text-danger small"/>
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <p:outputLabel for="username"
                                                   value="Nombre de usuario"
                                                   styleClass="form-label"/>

                                    <p:inputText id="username"
                                                 value="#{registroBean.username}"
                                                 required="true"
                                                 requiredMessage="El nombre de usuario es obligatorio"
                                                 validatorMessage="El usuario debe tener entre 3 y 20 caracteres (letras, números, punto, guion o guion bajo)"
                                                 styleClass="form-control">
                                    </p:inputText>

                                    <div class="form-text">
                                        Lo usarás para iniciar sesión.
                                    </div>

                                    <p:message for="username"
                                               styleClass="text-danger small"/>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <p:outputLabel for="fechaNacimiento"
                                                       value="Fecha de nacimiento"
                                                       styleClass="form-label"/>

                                        <h:inputText id="fechaNacimiento"
                                                     value="#{registroBean.fechaNacimiento}"
                                                     required="true"
                                                     requiredMessage="La fecha de nacimiento es obligatoria"
                                                     styleClass="form-control"
                                                     pt:type="date"/>

                                        <p:message for="fechaNacimiento"
                                                   styleClass="text-danger small"/>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <p:outputLabel for="email"
                                                       value="Email"
                                                       styleClass="form-label"/>

                                        <p:inputText id="email"
                                                     value="#{registroBean.email}"
                                                     required="true"
                                                     requiredMessage="El email es obligatorio"
                                                     validatorMessage="El email no tiene un formato válido"
                                                     styleClass="form-control">
                                            <f:validateRegex pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$"/>
                                        </p:inputText>

                                        <p:message for="email"
                                                   styleClass="text-danger small"/>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <p:outputLabel for="password"
                                                       value="Contraseña"
                                                       styleClass="form-label"/>

                                        <p:password id="password"
                                                    value="#{registroBean.password}"
                                                    required="true"
                                                    requiredMessage="La contraseña es obligatoria"
                                                    validatorMessage="La contraseña debe tener al menos 4 caracteres"
                                                    feedback="false"
                                                    styleClass="form-control">
                                            <f:validateLength minimum="4"/>
                                        </p:password>

                                        <p:message for="password"
                                                   styleClass="text-danger small"/>
                                    </div>

                                    <div class="col-md-6 mb-3">
                                        <p:outputLabel for="confirmarPassword"
                                                       value="Confirmar contraseña"
                                                       styleClass="form-label"/>

                                        <p:password id="confirmarPassword"
                                                    value="#{registroBean.confirmarPassword}"
                                                    required="true"
                                                    requiredMessage="Confirma la contraseña"
                                                    feedback="false"
                                                    styleClass="form-control"/>

                                        <p:message for="confirmarPassword"
                                                   styleClass="text-danger small"/>
                                    </div>
                                </div>

                                <div class="form-check mb-3">
                                    <h:selectBooleanCheckbox id="condiciones"
                                                             value="#{registroBean.condiciones}"
                                                             styleClass="form-check-input"/>

                                    <label class="form-check-label" for="condiciones">
                                        Acepto las condiciones de uso
                                    </label>

                                    <p:message for="condiciones"
                                               styleClass="text-danger small"/>
                                </div>

                                <div class="d-grid gap-2">
                                    <p:commandButton value="Registrarse"
                                                     action="#{registroBean.registrar}"
                                                     ajax="false"
                                                     styleClass="btn btn-success fw-bold"/>

                                    <a href="login.xhtml"
                                       class="btn btn-outline-secondary">
                                        Ya tengo cuenta
                                    </a>
                                </div>

                            </h:form>

                        </div>
                    </div>

                </div>
            </div>

        </div>

    </ui:define>

</ui:composition>
