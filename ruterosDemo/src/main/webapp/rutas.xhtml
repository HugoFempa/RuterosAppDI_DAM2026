<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:f="jakarta.faces.core"
    xmlns:p="primefaces"
    template="/WEB-INF/templates/ruteros-template.xhtml">

    <ui:define name="title">RUTEROS · Explorar rutas</ui:define>

    <ui:define name="content">

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1 class="h3 mb-0">Explorar rutas</h1>
            <a href="crearRuta.xhtml" class="btn btn-success">+ Crear ruta</a>
        </div>

        <h:form id="listaForm">

            <div class="row mb-3">
                <div class="col-md-4">
                    <p:outputLabel for="dificultad" value="Filtrar por dificultad"/>
                    <p:selectOneMenu id="dificultad"
                                     value="#{rutasBean.filtroDificultad}"
                                     styleClass="form-select">
                        <f:selectItem itemLabel="Todas" itemValue=""/>
                        <f:selectItem itemLabel="Fácil" itemValue="Fácil"/>
                        <f:selectItem itemLabel="Media" itemValue="Media"/>
                        <f:selectItem itemLabel="Alta" itemValue="Alta"/>
                        <p:ajax update="listaRutas"/>
                    </p:selectOneMenu>
                </div>
            </div>

            <h:panelGroup id="listaRutas" layout="block">
                <div class="row g-3">
                    <ui:repeat value="#{rutasBean.rutasFiltradas}" var="ruta">
                        <div class="col-12 col-sm-6 col-lg-4">
                            <div class="card h-100">
                                <h:graphicImage library="img" name="#{ruta.imagen}"
                                                styleClass="card-img-top" alt="#{ruta.alt}"/>
                                <div class="card-body d-flex flex-column">
                                    <h5 class="card-title">#{ruta.nombre}</h5>
                                    <p class="card-text small text-muted mb-2">
                                        #{ruta.ubicacion} · Creada por #{ruta.autor}
                                    </p>
                                    <span class="badge bg-success mb-2 align-self-start">
                                        #{ruta.dificultad}
                                    </span>
                                    <p class="card-text">#{ruta.descripcion}</p>

                                    <div class="mt-auto d-flex gap-2 flex-wrap">
                                        <h:link outcome="ruta" value="Ver"
                                                styleClass="btn btn-primary btn-sm">
                                            <f:param name="id" value="#{ruta.id}"/>
                                        </h:link>

                                        <p:commandButton
                                            value="#{rutasBean.esFavorita(ruta) ? 'Quitar favorito' : 'Favorito'}"
                                            action="#{rutasBean.toggleFavorito(ruta)}"
                                            process="@this"
                                            update="@form :mensajes"
                                            styleClass="btn btn-outline-success btn-sm"/>

                                        <p:commandButton value="Borrar"
                                                         action="#{rutasBean.eliminar(ruta)}"
                                                         process="@this"
                                                         update="@form :mensajes"
                                                         rendered="#{rutasBean.puedeBorrar(ruta)}"
                                                         styleClass="btn btn-outline-danger btn-sm"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </ui:repeat>
                </div>

                <p class="text-muted mt-3" rendered="#{empty rutasBean.rutasFiltradas}">
                    No hay rutas con ese filtro.
                </p>
            </h:panelGroup>

        </h:form>

    </ui:define>

</ui:composition>
