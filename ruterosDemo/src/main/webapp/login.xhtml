<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:f="jakarta.faces.core"
    xmlns:p="primefaces"
    template="/WEB-INF/templates/ruteros-template.xhtml">

    <ui:define name="title">RUTEROS · Iniciar sesión</ui:define>

    <ui:define name="content">

        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card">
                    <div class="card-body p-4">

                        <h1 class="h3 text-center mb-3">Iniciar sesión</h1>
                        <p class="text-center text-muted">
                            Prueba con <strong>user</strong> / <strong>pass</strong>.
                        </p>

                        <h:form id="loginForm">

                            <div class="mb-3">
                                <p:outputLabel for="username" value="Usuario"/>
                                <p:inputText id="username"
                                             value="#{loginBean.username}"
                                             required="true"
                                             requiredMessage="El usuario es obligatorio"
                                             styleClass="form-control"/>
                            </div>

                            <div class="mb-3">
                                <p:outputLabel for="password" value="Contraseña"/>
                                <p:password id="password"
                                            value="#{loginBean.password}"
                                            required="true"
                                            requiredMessage="La contraseña es obligatoria"
                                            styleClass="form-control"/>
                            </div>

                            <p:commandButton value="Entrar"
                                             action="#{loginBean.login}"
                                             ajax="false"
                                             process="@form"
                                             styleClass="btn btn-success w-100"/>

                        </h:form>

                        <div class="d-flex justify-content-between mt-3 small">
                            <a href="recuperacion.xhtml">¿Olvidaste tu contraseña?</a>
                            <a href="registro.xhtml">Crear cuenta</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>

    </ui:define>

</ui:composition>
