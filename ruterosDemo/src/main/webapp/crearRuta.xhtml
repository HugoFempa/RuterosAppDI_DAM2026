<ui:composition
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:ui="jakarta.faces.facelets"
    xmlns:f="jakarta.faces.core"
    xmlns:p="primefaces"
    template="/WEB-INF/templates/ruteros-template.xhtml">

    <ui:define name="title">RUTEROS · Crear ruta</ui:define>

    <ui:define name="content">

        <h1 class="h3 mb-3">Crear una ruta</h1>

        <ui:fragment rendered="#{!loginBean.logueado}">
            <div class="alert alert-warning">
                Para crear una ruta tienes que iniciar sesión.
                <a href="login.xhtml" class="alert-link">Ir al login</a>.
            </div>
        </ui:fragment>

        <ui:fragment rendered="#{loginBean.logueado}">
            <div class="card">
                <div class="card-body">

                    <h:form id="crearForm">

                        <div class="mb-3">
                            <p:outputLabel for="nombre" value="Nombre de la ruta"/>
                            <p:inputText id="nombre"
                                         value="#{rutasBean.nombre}"
                                         required="true"
                                         requiredMessage="El nombre es obligatorio"
                                         styleClass="form-control"/>
                        </div>

                        <div class="mb-3">
                            <p:outputLabel for="descripcion" value="Descripción"/>
                            <p:inputTextarea id="descripcion"
                                             value="#{rutasBean.descripcion}"
                                             required="true"
                                             requiredMessage="La descripción es obligatoria"
                                             rows="3"
                                             styleClass="form-control"/>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <p:outputLabel for="ubicacion" value="Ubicación"/>
                                <p:inputText id="ubicacion"
                                             value="#{rutasBean.ubicacion}"
                                             required="true"
                                             requiredMessage="La ubicación es obligatoria"
                                             styleClass="form-control"/>
                            </div>

                            <div class="col-md-6 mb-3">
                                <p:outputLabel for="dificultad" value="Dificultad"/>
                                <p:selectOneMenu id="dificultad"
                                                 value="#{rutasBean.dificultad}"
                                                 styleClass="form-select">
                                    <f:selectItem itemLabel="Fácil" itemValue="Fácil"/>
                                    <f:selectItem itemLabel="Media" itemValue="Media"/>
                                    <f:selectItem itemLabel="Alta" itemValue="Alta"/>
                                </p:selectOneMenu>
                            </div>
                        </div>

                        <div class="mb-3">
                            <p:outputLabel for="imagen" value="Imagen"/>
                            <p:selectOneMenu id="imagen"
                                             value="#{rutasBean.imagen}"
                                             styleClass="form-select">
                                <f:selectItem itemLabel="Monte" itemValue="monte_ruta_1.webp"/>
                                <f:selectItem itemLabel="Faro" itemValue="rutafaro.webp"/>
                                <f:selectItem itemLabel="Cueva" itemValue="rutacova.webp"/>
                                <f:selectItem itemLabel="Forat de Bèrnia" itemValue="rutaforat.webp"/>
                                <f:selectItem itemLabel="Viaje" itemValue="viajefoto.webp"/>
                            </p:selectOneMenu>
                        </div>

                        <p:commandButton value="Guardar ruta"
                                         action="#{rutasBean.crear}"
                                         ajax="false"
                                         process="@form"
                                         styleClass="btn btn-success"/>
                        <a href="rutas.xhtml" class="btn btn-link">Cancelar</a>

                    </h:form>

                </div>
            </div>
        </ui:fragment>

    </ui:define>

</ui:composition>
