<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperacion</title>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body>
    <header class="container-fluid">
        <div class="row">
            <div class="col" style="border: 2px solid red;">ESTO ES LA CABECERA</div>
        </div>
    </header>
    <div class="container-fluid">
        <h1 class="text-primary text-center">Recupera tu contraseña</h1>
        <div class="row justify-content-center mt-4">
            <div class="col-12 col-md-4">
                <div class="card">
                    <div class="card-body">
                        <p class="text-secondary">Introduce el email de tu cuennta y te enviaremos un enlace para restablecer tu contraseña</p>

                        <form action="">
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" placeholder="nombre@ejemplo.com" required>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-outlined-primary">Enviar enlace</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer>
        <div class="row">
            <div class="col" style="border: 2px solid red;">ESTO ES EL FOOTER</div>
        </div>
    </footer>
    <script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
